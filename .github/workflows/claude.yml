# Instalado pela Central GLP. Para mudar, edite execucao/claude.yml no repositório
# central-glp e rode `npm run execucao -- instalar` lá. Edições feitas aqui são
# sobrescritas na próxima instalação.
#
# Uma issue (ou comentário) com @claude faz o Claude trabalhar neste repositório.
# As mudanças vão para uma branch claude/issue-<n>-...; o Claude comenta na issue
# com o link para abrir o pull request. Nada chega à branch principal sem merge.
name: Claude (Central GLP)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*)"
